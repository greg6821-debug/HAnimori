name: drift-accept

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  accept:
    runs-on: ubuntu-latest
    steps:
      - name: Исходный код
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.FORMATTING_TOKEN }}

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Зависимости
        run: npm ci

      - name: Принять новый дрейф
        run: npm run drift:accept

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: принять дрейф (Hentasis только в Windows)"
          git push
