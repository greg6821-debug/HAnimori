# Исключения gitleaks под репо детекта. Детекторы — встроенный набор.
# Скан идёт по всей истории, поэтому allowlist привязан к пути, а не к коммиту.
title = "AniMori: исключения gitleaks"

[extend]
useDefault = true

# Ключ Kodik личный, ротации нет; глушим по файлам, где он жил в истории (скан идёт по всей истории).
[allowlist]
description = "Ключ Kodik в открытом виде — ротации не подлежит"
paths = [
  '''(^|/)kodik\.ts$''',
  '''(^|/)net-check\.ts$''',
  '''(^|/)player\.ts$''',
  '''(^|/)animori\.user\.js$''',
]

